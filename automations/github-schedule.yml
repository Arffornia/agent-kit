# Run one automation prompt on a GitHub schedule (agent-kit template).
# Copy to .github/workflows/agent-<name>.yml in the repo the agent writes to, copy the prompt to
# .github/agents/<name>.md, set AGENT and the cron. Single-repo agents only: the token reaches this repo.
# Auth: ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN (one of them), plus the Claude GitHub App.
name: agent (scheduled)

on:
  schedule:
    - cron: "20 4 * * 1"        # UTC; e.g. Monday 05:20 Paris in winter
  workflow_dispatch:

permissions: {}

concurrency:
  group: agent-${{ github.workflow }}
  cancel-in-progress: false

env:
  AGENT: doc-gardener            # the prompt file name, without .md

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120         # the prompt's hard cap
    permissions:
      contents: write            # push its own branch only (see the prompt's guardrails)
      pull-requests: write       # open draft PRs
      issues: write              # for agents whose destination is an issue
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Read `.github/agents/${{ env.AGENT }}.md` and follow it exactly for this repository only
            (`${{ github.repository }}`). The other repos it lists are out of scope in this run.
          settings: |
            {"permissions": {"deny": ["Bash(gh pr merge *)", "Bash(gh release *)", "Bash(git tag *)",
              "Bash(git push --force *)", "Bash(git push origin main *)", "Bash(gh secret *)"]}}
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 300
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(git *),Bash(gh pr create *),Bash(gh pr list *),Bash(gh pr view *),Bash(gh issue *),Bash(gh api *),Bash(make *)"
