# Secret scanning with gitleaks (agent-kit template). Copy to .github/workflows/gitleaks.yml.
# Uses the gitleaks binary (MIT) with a verified checksum, not gitleaks-action, which needs a paid
# license for organization repositories.
#
# PRs scan only the PR's commits; pushes to main scan the pushed range; the weekly run scans the
# full history. A finding fails the job: rotate the secret first, then remove it (see README).
# False positive: add a `.gitleaksignore` line with the finding's Fingerprint, or a
# `# gitleaks:allow` comment on the line, and say why in the PR.
name: gitleaks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }} (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$tgz"
          curl -fsSL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $tgz\$" | sha256sum -c -
          tar -xzf "$tgz" gitleaks && sudo install gitleaks /usr/local/bin/gitleaks
      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request) range="$BASE..$HEAD" ;;
            push) if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then range="$AFTER~1..$AFTER"; else range="$BEFORE..$AFTER"; fi ;;
            *) range="" ;;
          esac
          args=(git --redact --no-banner --report-format sarif --report-path gitleaks.sarif)
          [ -f .gitleaks.toml ] && args+=(--config .gitleaks.toml)
          if [ -n "$range" ]; then args+=(--log-opts="$range"); fi
          if ! gitleaks "${args[@]}" .; then
            {
              echo "### gitleaks found a secret"
              echo "1. Treat it as leaked: rotate it at the provider now (the repo is public)."
              echo "2. Remove it from the code and load it from the environment or the secret store."
              echo "3. False positive? Add its Fingerprint to .gitleaksignore (or \`# gitleaks:allow\` on the line) and explain in the PR."
              echo "Do not paste the secret in an issue or PR."
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          retention-days: 7
