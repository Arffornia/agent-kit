# ArchUnit config for the architecture guards (copy to src/test/resources/archunit.properties).
# Frozen violations (pre-existing debt) live in this store, committed to git.
freeze.store.default.path=src/test/resources/archunit_store
# The store is committed; a missing store means a broken checkout, so fail instead of silently recreating it.
# To (re)create it once: ./gradlew test -Darchunit.freeze.store.default.allowStoreCreation=true
freeze.store.default.allowStoreCreation=false
freeze.refreeze=false
